[project]
name = "playwright-practice-pom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tuan Minh", email = "118454305+MaximNguen@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "allure-pytest>=2.16.0",
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[dependency-groups]
dev = [
    "flake8>=7.2.0",
    "ruff>=0.14.0",
]

[project.scripts]
playwright-practice-pom = "playwright_practice_pom:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
minversion = "9.1"
addopts = "-v"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pages", "locators", "utils", "data"]
